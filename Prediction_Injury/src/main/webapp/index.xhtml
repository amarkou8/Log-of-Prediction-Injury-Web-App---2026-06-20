<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">
    <h:head>
        <title>ASDV </title> 

        <h:outputStylesheet library="css" name="1.css"/>  
        <style>
            .text-only-inplace .ui-inplace-display
            {

                background: transparent !important; /* Removes button background */
                border: none !important; /* Removes any borders */
                box-shadow: none !important; /* Removes 3D depth/shadows */
                padding: 0 !important; /* Removes button padding */
                color: #2196F3  !important; /* Makes text color match surrounding text */
                text-decoration: none !important; /* Removes any underlines */
                font-weight: normal !important; /* Prevents bolding if the theme does it */
                cursor: pointer; /* Keeps the hand cursor so users know they can click */
            }

            /*  Add a slight underline ONLY when they hover over it so they know it's editable */
            .text-only-inplace  .ui-inplace-display:hover {
                text-decoration: underline !important;
                background-color: transparent !important;
            }
        </style>

        <script >
            function startStatusDialog()
            {
                PF('statusDialog').show();
            }
            function stopStatusDialog()
            {
                PF('statusDialog').hide();
            }
        </script>


        <script type="text/javascript">
            window.addEventListener('beforeunload', function (event) {
                // Execute the global JavaScript function generated by p:remoteCommand
                if (typeof sessionCleanup === 'function') {
                    sessionCleanup();
                }
            });
        </script>
    </h:head>
    <h:body>
        <p:growl id="id_growl" showDetail="true"/>

        <h:form id="cleanupForm">
            <p:remoteCommand name="sessionCleanup" 
                             action="#{testBean.invalidateSession}" 
                             async="false" />
        </h:form>

        <header class="asdvHeader">
            <h1 class="headerClass"> Multimodal Sports Athlete-Injury Predictor </h1> 
            <h3 class="headerClass"> ASDV @ South Louisiana Community College </h3>
        </header>

        <div style="display: flex;
             flex-direction: column;  /* Stacks items from top to bottom */
             justify-content: center; /* Centers content vertically (main axis) */
             align-items: center;     /* Centers content horizontally (cross axis) */
             width: 100%; padding-top: 2rem;">

            <p:outputLabel escape="false" style="color: #747474;"
                           value="This application currently uses Deeplearning4j and the Keggar public data of 15,420 cases to&lt;br /&gt; create a Neural Network which predicts with 67.52% accuracy 1 of the 3: 
                           &lt;br /&gt;&lt;br /&gt; &nbsp;&nbsp;&nbsp;  1.  The athlete will be healthy during the next sports event.
                           &lt;br /&gt; &nbsp;&nbsp;&nbsp;  2.  Low risk, the athlete might have an injury during the next sports event.
                           &lt;br /&gt; &nbsp;&nbsp;&nbsp;  3.  High risk, the athlete might have an injury during the next sports event.
                           &lt;br /&gt;&lt;br /&gt;  
                           "/>
            <h:form >                   
                <p:commandLink value="Download Dataset-Kaggle.CSV"
                               title="Download the CSV file whose data is used to create and test the Neural Network."
                               ajax="false">                        
                    <p:fileDownload value="#{testBean.fileStreamContent}" />                                                                                           
                </p:commandLink> 

                <p:inplace editor="true" 
                           style="margin-left: 20px;"
                           label="Show the variables" 
                           styleClass="hide-inplace-save  blue-inplace text-only-inplace">
                    <p:graphicImage library="images" name="keggar.jpg" />      
                </p:inplace>


            </h:form>
        </div>


        <div style="margin: 0 2rem;  padding-bottom: 2rem;
             min-height: 500px !important; overflow-y: auto;">


            <h:form>
                <p:remoteCommand name="stop" 
                                 oncomplete="PF('statusDialog').hide();" />

                <p:dialog widgetVar="statusDialog" 
                          modal="true" 
                          draggable="false" 
                          closable="false" 
                          resizable="false" 
                          showHeader="false">
                    <p:graphicImage library="images" 
                                    name="ajax-loader.gif" />  <p:outputLabel escape="false"  value="&nbsp;&nbsp;&nbsp;ASDV"/>
                    <p:outputLabel escape="false" 
                                   value="&lt;br /&gt;&lt;br /&gt;Creating, training and testing the integrity of the Neural Network of &lt;br /&gt; athlete-injuries from a 15,420-lines .csv file of data. &lt;br /&gt;&lt;br /&gt;The Evaluation Metrics and the Confusion Matrix &lt;br /&gt; will be displayed after the creation and the testing &lt;br /&gt; of the prediction-accuracy of the Neural Network &lt;br /&gt; is finished. &lt;br /&gt; &lt;br /&gt;It may take a few minutes, please wait . . ." />
                </p:dialog>
            </h:form>

            <h:form id="wizardForm">
                <p:steps activeIndex="#{testBean.activeIndex}" 
                         readonly="true">
                    <p:menuitem style="color: #747474 !important;" value="Neural Network"/>
                    <p:menuitem style="color: #747474 !important;"  value="Prediction"             />
                </p:steps>

                <h:panelGroup id="stepContent" 
                              layout="block" style="margin: 20px 0;">

                    <h:panelGroup rendered="#{testBean.activeIndex == 0}">
                        <p:commandLink  value="Click to create, train and load to the Glassfish Server the Neural Network." 
                                        action="#{testBean.createNeuralNetworkTrainandTest()}"
                                        onstart="startStatusDialog()"
                                        oncomplete="stopStatusDialog()"
                                        update="@all"
                                        title="Create and test the prediction-accuracy of the Neural Network. It may take few minutes."/>

                    </h:panelGroup>

                    <h:panelGroup rendered="#{testBean.activeIndex == 1}" style="float: right;">
                        <p:link title="Go to prediction of a possible athlete-injury" 
                                value="Click to predict, with 67.52% accuracy, a possible athlete-injury." 
                                outcome="predictor"/>  
                    </h:panelGroup>

                </h:panelGroup>

                <h:panelGroup layout="block" 
                              rendered="false"
                              style="margin-top: 20px;">


                    <p:commandButton value="Next" action="#{testBean.next}" 
                                     update="wizardForm" 
                                     disabled="#{testBean.activeIndex == 0}" />


                </h:panelGroup>
                <p:outputLabel escape="false"
                               style="display: block; text-align: center;" 
                               value="#{testBean.getResults()}" />
            </h:form>

        </div>

        <footer class="asdvFooter" style="text-align: center;">
            &copy; 2026 ASDV @ South Louisiana Community College. All rights reserved.
            <span style="display: block; margin-top: 5px; color: #747474; font-family: 'Brush Script MT', cursive; font-size: 0.9rem; ">
                We develop software with style...
            </span>
        </footer>
    </h:body>
</html>
